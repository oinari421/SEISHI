<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>白いオタマジャクシ対戦探索ゲーム</title>
    <style>
      /* =========================================================
         画面全体の見た目
         タイトル、キャラ選択、ロビー、ゲーム画面、結果画面をここで装飾
         ========================================================= */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #061b29;
        color: #eaffff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(
          circle at 80% 20%,
          #19546b,
          transparent 35%
        );
      }
      h1 {
        font-size: clamp(52px, 9vw, 110px);
        line-height: 0.85;
        margin: 10px;
        text-align: center;
      }
      h1 span {
        color: #ffd166;
      }
      .sub {
        color: #65d9e8;
        font-weight: 900;
        letter-spacing: 0.25em;
      }
      .lead {
        color: #b4d6df;
      }
      .primary,
      .secondary {
        border: 0;
        border-radius: 99px;
        font-weight: 900;
        padding: 17px 30px;
        min-width: 230px;
      }
      .primary {
        background: #ffd166;
        color: #102332;
      }
      .secondary {
        background: #143b50;
        color: #eaffff;
        border: 1px solid #65d9e8;
      }
      .menu {
        display: grid;
        gap: 12px;
        margin: 20px;
      }
      .types {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        max-width: 1050px;
      }
      .type {
        background: #0d3044;
        color: white;
        border: 1px solid #6bb2c755;
        border-radius: 22px;
        padding: 20px;
        text-align: left;
        min-height: 235px;
      }
      .type.on {
        border-color: #ffd166;
        transform: translateY(-5px);
      }
      .type b {
        display: block;
        font-size: 19px;
        margin: 10px 0;
      }
      .type i {
        font-size: 34px;
        color: #ffd166;
      }
      .type span {
        font-size: 12px;
        color: #b4d5df;
        line-height: 1.7;
      }
      .panel {
        width: min(620px, 94vw);
        background: #082536dd;
        border: 1px solid #65d9e855;
        border-radius: 24px;
        padding: 24px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .tabs button {
        border: 0;
        border-radius: 12px;
        padding: 13px;
        background: #123d51;
        color: #fff;
        font-weight: 900;
      }
      .tabs button.on {
        background: #ffd166;
        color: #102332;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 18px 0;
      }
      .field input,
      .field select {
        width: 100%;
        background: #061b29;
        color: #fff;
        border: 1px solid #65d9e866;
        border-radius: 12px;
        padding: 13px;
      }
      .codebox {
        display: flex;
        gap: 8px;
      }
      .codebox input {
        font: 900 18px monospace;
        letter-spacing: 0.1em;
      }
      .players {
        display: grid;
        gap: 7px;
        margin: 14px 0;
      }
      .playerrow {
        display: flex;
        justify-content: space-between;
        background: #0d3044;
        border-radius: 10px;
        padding: 10px 13px;
      }
      .status {
        min-height: 24px;
        color: #65d9e8;
      }
      .game {
        height: 100vh;
        display: none;
        flex-direction: column;
      }
      .hud {
        height: 68px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 9px 20px;
        background: #051721;
      }
      .hud .time {
        font: 900 32px monospace;
        color: #ffd166;
        margin-right: auto;
      }
      .scores {
        display: flex;
        gap: 6px;
      }
      .scores span {
        background: #123547;
        border-radius: 8px;
        padding: 7px;
        font-size: 11px;
      }
      .scores .you {
        background: #ffd166;
        color: #102332;
      }
      .wrap {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
        position: relative;
      }
      .wrap canvas {
        width: min(100%, calc((100vh - 165px) * 1.667));
        aspect-ratio: 5/3;
        border: 1px solid #5fcde755;
        border-radius: 16px;
      }
      .toast {
        position: absolute;
        top: 25px;
        background: #071d2deb;
        border: 1px solid #ffd166;
        color: #ffd166;
        border-radius: 99px;
        padding: 10px 22px;
        font-weight: 900;
      }
      .controls {
        height: 97px;
        background: #051721;
        display: flex;
        align-items: center;
        justify-content: space-around;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item b {
        background: #173d50;
        border-radius: 12px;
        padding: 13px;
      }
      .item button,
      .dash {
        border: 0;
        border-radius: 50px;
        font-weight: 900;
      }
      .item button {
        padding: 11px;
        background: #ffd166;
      }
      .dash {
        width: 104px;
        height: 67px;
        background: #b84343;
        color: white;
        border: 2px solid #ffb09f;
        transition: 0.15s;
      }
      .dash.cooling {
        background: #3a4650;
        border-color: #71818d;
        color: #aebac2;
      }
      .help {
        font-size: 12px;
        color: #8db7c3;
      }
      .result .row {
        width: min(480px, 90vw);
        display: grid;
        grid-template-columns: 50px 1fr auto;
        padding: 13px 20px;
        margin: 6px;
        background: #0d3044;
        border-radius: 13px;
      }
      .result strong {
        color: #ffd166;
      }
      @media (max-width: 750px) {
        .types {
          grid-template-columns: 1fr 1fr;
        }
        .type {
          min-height: 190px;
          padding: 14px;
        }
        .screen {
          justify-content: flex-start;
          overflow: auto;
        }
        .scores span {
          font-size: 9px;
          padding: 5px;
        }
        .help {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- タイトル画面：遊ぶモードを選択する -->
    <section id="title" class="screen">
      <div class="sub">SEARCH × BLUFF × BATTLE</div>
      <h1>白い<br /><span>オタマジャクシ</span></h1>
      <p class="lead">広いマップから卵子を探し、動きで騙し、先に入り込め。</p>
      <div class="menu">
        <button class="primary" onclick="beginMode('solo')">一人で練習</button
        ><button class="secondary" onclick="beginMode('local')">
          ローカル対戦
        </button>
      </div>
      <p class="help">
        PC：WASD / 矢印キーで移動・Spaceでタックル・Eでアイテム
      </p>
    </section>
    <!-- 能力選択画面：一人用は開始前、対戦は全員入室後に表示する -->
    <section id="select" class="screen" style="display: none">
      <div class="sub">SELECT YOUR TYPE</div>
      <h2 id="selectTitle">泳ぎ方を選ぶ</h2>
      <div class="types" id="types"></div>
      <br /><button class="primary" id="typeConfirm" onclick="afterType()">
        このタイプで決定 →
      </button>
      <p id="selectStatus" class="status"></p>
    </section>
    <!-- ローカル対戦ロビー：部屋作成、招待コード参加、人数設定 -->
    <section id="lobby" class="screen" style="display: none">
      <div class="sub">LOCAL MATCH</div>
      <h2>招待ロビー</h2>
      <div class="panel">
        <div class="tabs">
          <button id="hostTab" class="on" onclick="setLobbyTab('host')">
            部屋を作る</button
          ><button id="joinTab" onclick="setLobbyTab('join')">
            コードで参加
          </button>
        </div>
        <div id="hostPane">
          <div class="field">
            <label>対戦人数</label
            ><select id="playerLimit" onchange="broadcastLobby()">
              <option>2</option>
              <option>3</option>
              <option selected>4</option>
              <option>5</option>
              <option>6</option>
            </select>
          </div>
          <div class="field">
            <label
              ><input
                id="fillCpu"
                type="checkbox"
                checked
                onchange="broadcastLobby()"
              />
              空席をCPUで補充する</label
            >
          </div>
          <button class="primary" id="createRoomBtn" onclick="createRoom()">
            招待コードを発行
          </button>
        </div>
        <div id="joinPane" style="display: none">
          <div class="field">
            <label>招待コード</label
            ><input id="joinCode" maxlength="20" placeholder="例：ABCD-1234" />
          </div>
          <button class="primary" onclick="joinRoom()">部屋に参加</button>
        </div>
        <div id="inviteArea" style="display: none">
          <div class="field">
            <label>招待コード</label>
            <div class="codebox">
              <input id="inviteCode" readonly /><button
                class="secondary"
                onclick="copyInvite()"
              >
                コピー
              </button>
            </div>
          </div>
          <div id="players" class="players"></div>
          <button
            class="primary"
            id="hostStart"
            style="display: none"
            onclick="startLocalMatch()"
          >
            対戦を開始
          </button>
        </div>
        <p id="netStatus" class="status"></p>
      </div>
    </section>
    <!-- ゲーム本編：HUD、Canvas、アイテム・タックル操作 -->
    <section id="game" class="game">
      <header class="hud">
        <b>ROUND <span id="round">1</span>/3</b>
        <div class="time" id="time">60</div>
        <div class="scores" id="scores"></div>
      </header>
      <div class="wrap">
        <canvas id="cv" width="1000" height="600"></canvas>
        <div id="toast" class="toast" style="display: none"></div>
      </div>
      <footer class="controls">
        <div class="help">移動 WASD / 矢印　タックル SPACE</div>
        <div class="item">
          <b id="itemIcon">–</b><span id="itemName">アイテムなし</span
          ><button onclick="useItem()">使う E</button>
        </div>
        <button class="dash" id="dash">
          TACKLE<br /><small id="tackleStatus">SPACE</small>
        </button>
      </footer>
    </section>
    <!-- 3ラウンド終了後の最終結果画面 -->
    <section id="result" class="screen result" style="display: none">
      <div class="sub">FINAL RESULT</div>
      <h2 id="resultTitle">試合終了</h2>
      <div id="ranking"></div>
      <br /><button class="primary" onclick="replay()">もう一度遊ぶ ↻</button>
    </section>
    <!-- PeerJS：招待コードを使った端末間通信に使用 -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script>
      // =========================================================
      // 1. キャラクター・アイテム・ゲームバランスの設定
      //    数値を調整したい場合は、まずこの付近を変更する
      // =========================================================
      const K = [
        [
          "chemo",
          "◉",
          "ケモタクシス型",
          "卵子に近づくほど発光。反応は全員から見える。",
        ],
        ["rheo", "≋", "レオタクシス型", "水流に逆らうと加速し、流されにくい。"],
        [
          "hyper",
          "➤",
          "ハイパーアクティブ型",
          "強力な突進で相手を大きく押し出す。",
        ],
        [
          "capac",
          "✦",
          "カパシテーション型",
          "20秒後に成熟し、速度とダッシュ回復が強化。",
        ],
      ];
      const ITEMS = {
        sensor: ["⌁", "誘引センサー"],
        boost: ["⚡", "超活性剤"],
        energy: ["↻", "尾部エネルギー"],
        coat: ["◌", "粘液コート"],
        dummy: ["?", "ダミーフェロモン"],
        zinc: ["✺", "亜鉛バースト"],
      };
      const MAP_SCALE = 0.92,
        M = (n) => Math.round(n * MAP_SCALE),
        WORLD_W = M(3600),
        WORLD_H = M(2160),
        VIEW_W = 1000,
        VIEW_H = 600,
        CAPTURE_TIME = 3,
        EGG_RADIUS = 66,
        EGG_DRAW_RADIUS = 60,
        EGG_KNOCKBACK = 1.7,
        START_SAFE_RADIUS = 300,
        TACKLE_COOLDOWN = 2,
        TACKLE_TIME = 0.22,
        TACKLE_SPEED = 520,
        MISS_STUN = 0.7;
      // マップ内の壁。x/yが左上座標、w/hが幅と高さ。
      const WALLS = [
        { x: 1150, y: 0, w: 34, h: 360 },
        { x: 1150, y: 540, w: 34, h: 520 },
        { x: 1150, y: 1240, w: 34, h: 500 },
        { x: 1150, y: 1920, w: 34, h: 240 },
        { x: 2400, y: 0, w: 34, h: 480 },
        { x: 2400, y: 660, w: 34, h: 540 },
        { x: 2400, y: 1380, w: 34, h: 360 },
        { x: 2400, y: 1920, w: 34, h: 240 },
        { x: 0, y: 690, w: 470, h: 34 },
        { x: 650, y: 690, w: 620, h: 34 },
        { x: 1450, y: 690, w: 570, h: 34 },
        { x: 2200, y: 690, w: 520, h: 34 },
        { x: 2900, y: 690, w: 700, h: 34 },
        { x: 0, y: 1450, w: 600, h: 34 },
        { x: 780, y: 1450, w: 520, h: 34 },
        { x: 1480, y: 1450, w: 500, h: 34 },
        { x: 2160, y: 1450, w: 610, h: 34 },
        { x: 2950, y: 1450, w: 650, h: 34 },
      ].map((w) => ({ x: M(w.x), y: M(w.y), w: M(w.w), h: M(w.h) }));
      // =========================================================
      // 2. ゲーム全体で共有する状態
      // =========================================================
      let kind = "chemo",
        mode = "solo",
        round = 1,
        scores = [0, 0, 0, 0, 0],
        S,
        keys = {},
        last = 0,
        elapsed = 0,
        raf,
        boost = 0,
        sensor = 0,
        dummy = null,
        dummyT = 0,
        tackleQueued = false,
        peer = null,
        isHost = false,
        myId = 0,
        connections = [],
        remoteInputs = {},
        lobbyMembers = [],
        matchPlayers = 5,
        lastNetSend = 0,
        countdownId = 0,
        localPhase = "lobby";
      // キャラクター選択ボタンをKの設定から自動生成する。
      types.innerHTML = K.map(
        (k, i) =>
          `<button class="type ${i ? "" : "on"}" onclick="choose('${k[0]}',this)"><i>${k[1]}</i><b>${k[2]}</b><span>${k[3]}</span></button>`,
      ).join("");
      // 選択したキャラクタータイプを保存し、選択中の見た目を更新。
      function choose(k, e) {
        kind = k;
        document
          .querySelectorAll(".type")
          .forEach((x) => x.classList.remove("on"));
        e.classList.add("on");
      }
      // タイトル画面から一人用またはローカル対戦へ進む。
      function beginMode(m) {
        mode = m;
        title.style.display = "none";
        if (mode === "solo") {
          openAbilitySelect("一人用の能力を選ぶ");
        } else {
          lobby.style.display = "flex";
          let q = new URLSearchParams(location.search).get("join");
          if (q) {
            setLobbyTab("join");
            joinCode.value = q;
            joinRoom();
          }
        }
      }
      function openAbilitySelect(titleText = "能力を選ぶ") {
        selectTitle.textContent = titleText;
        selectStatus.textContent = "";
        typeConfirm.disabled = false;
        typeConfirm.textContent = "このタイプで決定 →";
        lobby.style.display = title.style.display = result.style.display = "none";
        select.style.display = "flex";
      }
      // 一人用は即開始。対戦では選択内容をホストへ提出して全員を待つ。
      function afterType() {
        if (mode === "solo") {
          select.style.display = "none";
          start();
          return;
        }
        typeConfirm.disabled = true;
        typeConfirm.textContent = "選択済み";
        selectStatus.textContent = "他のプレイヤーの選択を待っています…";
        if (isHost) {
          let me = lobbyMembers.find((m) => m.id === 0);
          if (me) me.kind = kind;
          broadcastLobby();
          tryStartAfterAbilities();
        } else if (connections[0]?.open) {
          connections[0].send({ type: "ability", kind });
        }
      }
      // =========================================================
      // 3. ローカル対戦のロビー・通信処理
      //    ホストが試合を計算し、参加者へ状態を送信する方式
      // =========================================================

      // 招待コードを大文字英数字とハイフンだけに整える。
      function cleanCode(v) {
        return v
          .toUpperCase()
          .replace(/[^A-Z0-9-]/g, "")
          .slice(0, 20);
      }
      function setLobbyTab(t) {
        hostPane.style.display = t === "host" ? "block" : "none";
        joinPane.style.display = t === "join" ? "block" : "none";
        hostTab.classList.toggle("on", t === "host");
        joinTab.classList.toggle("on", t === "join");
        inviteArea.style.display = "none";
        netStatus.textContent = "";
      }
      function roomCode() {
        return "WOT-" + Math.random().toString(36).slice(2, 8).toUpperCase();
      }
      function peerReady() {
        if (window.Peer) return true;
        netStatus.textContent =
          "通信機能を読み込めませんでした。インターネット接続を確認してください。";
        return false;
      }
      // ホストとしてPeerJSの部屋を作り、招待コードを発行する。
      function createRoom() {
        if (!peerReady()) return;
        closePeer();
        isHost = true;
        let code = roomCode();
        netStatus.textContent = "部屋を作成中…";
        peer = new Peer(code.toLowerCase());
        peer.on("open", () => {
          inviteCode.value = code;
          inviteArea.style.display = "block";
          hostStart.style.display = "inline-block";
          localPhase = "lobby";
          lobbyMembers = [{ id: 0, name: "ホスト", kind: null }];
          renderLobby();
          netStatus.textContent = "友人の参加を待っています";
        });
        peer.on("connection", acceptGuest);
        peer.on("error", peerError);
      }
      // 新しい参加者を受け入れ、入力情報をホスト側で受信する。
      function acceptGuest(c) {
        if (localPhase !== "lobby" || lobbyMembers.length >= +playerLimit.value) {
          c.on("open", () =>
            c.send({ type: "error", message: "この部屋は満員です" }),
          );
          return;
        }
        connections.push(c);
        c.on("open", () => {});
        c.on("data", (d) => {
          if (d.type === "hello") {
            let id = lobbyMembers.length;
            lobbyMembers.push({ id, name: "ゲスト " + id, kind: null });
            c.playerId = id;
            c.send({ type: "welcome", id, settings: getSettings() });
            broadcastLobby();
          } else if (d.type === "input") remoteInputs[c.playerId] = d.input;
          else if (d.type === "use") applyItem(c.playerId);
          else if (d.type === "ability" && localPhase === "ability") {
            let member = lobbyMembers.find((m) => m.id === c.playerId);
            if (member && K.some((k) => k[0] === d.kind)) member.kind = d.kind;
            broadcastLobby();
            tryStartAfterAbilities();
          }
        });
        c.on("close", () => {
          lobbyMembers = lobbyMembers.filter((x) => x.id !== c.playerId);
          connections = connections.filter((x) => x !== c);
          broadcastLobby();
        });
      }
      // 招待コードを使ってホストの部屋へ接続する。
      function joinRoom() {
        if (!peerReady()) return;
        let code = cleanCode(joinCode.value);
        if (!code) {
          netStatus.textContent = "招待コードを入力してください";
          return;
        }
        closePeer();
        isHost = false;
        netStatus.textContent = "ホストへ接続中…";
        peer = new Peer();
        peer.on("open", () => {
          let c = peer.connect(code.toLowerCase(), { reliable: true });
          connections = [c];
          c.on("open", () => {
            c.send({ type: "hello" });
            netStatus.textContent = "接続しました。ホストの開始を待っています";
          });
          c.on("data", guestData);
          c.on(
            "close",
            () => (netStatus.textContent = "ホストとの接続が切れました"),
          );
        });
        peer.on("error", peerError);
      }
      // ゲスト側がホストから受け取ったメッセージを種類別に処理する。
      function guestData(d) {
        if (d.type === "welcome") {
          myId = d.id;
          inviteArea.style.display = "block";
          inviteCode.value = cleanCode(joinCode.value);
          hostStart.style.display = "none";
        }
        if (d.type === "lobby") {
          lobbyMembers = d.members;
          renderLobby();
        }
        if (d.type === "selectAbility") {
          localPhase = "ability";
          openAbilitySelect(`P${myId + 1}の能力を選ぶ`);
        }
        if (d.type === "start") {
          matchPlayers = d.count;
          scores = Array(matchPlayers).fill(0);
          round = 1;
          enterMatchScreen();
          netStatus.textContent = "";
          startGuestControls();
        }
        if (d.type === "countdown") showCountdown(d.value);
        if (d.type === "state") {
          S = d.S;
          elapsed = d.elapsed;
          round = d.round;
          scores = d.scores;
          boost = d.boost;
          sensor = d.sensor;
          dummy = d.dummy;
          document.getElementById("round").textContent = round;
          document.getElementById("time").textContent = Math.max(
            0,
            60 - Math.floor(elapsed),
          );
          renderScores();
          draw();
        }
        if (d.type === "end") showResult(d.scores);
        if (d.type === "error") netStatus.textContent = d.message;
      }
      function getSettings() {
        return { limit: +playerLimit.value, fillCpu: fillCpu.checked };
      }
      // 現在の参加者とルール設定を全ゲストへ共有する。
      function broadcastLobby() {
        if (!isHost) return;
        let d = {
          type: "lobby",
          members: lobbyMembers,
          settings: getSettings(),
        };
        connections.forEach((c) => c.open && c.send(d));
        renderLobby();
      }
      function renderLobby() {
        const faces = ["普通顔", "怒り顔", "眠そう", "泣き顔", "キラキラ", "ジト目"];
        players.innerHTML = lobbyMembers
          .map(
            (m, i) =>
              `<div class="playerrow"><span>${i ? "●" : "★"} P${m.id + 1} ${m.name}</span><b>${faces[m.id] || ""}${localPhase === "ability" ? " / " + (K.find((k) => k[0] === m.kind)?.[2] || "選択中") : ""}</b></div>`,
          )
          .join("");
        if (isHost) {
          let n = +playerLimit.value - lobbyMembers.length;
          if (fillCpu.checked && n > 0)
            players.innerHTML += `<div class="playerrow"><span>CPU補充</span><b>${n}体</b></div>`;
        }
      }
      async function copyInvite() {
        let url = location.href.split("?")[0] + "?join=" + inviteCode.value;
        try {
          await navigator.clipboard.writeText(url);
          netStatus.textContent = "招待URLをコピーしました";
        } catch {
          inviteCode.select();
          document.execCommand("copy");
          netStatus.textContent = "招待コードをコピーしました";
        }
      }
      function peerError(e) {
        netStatus.textContent =
          e.type === "peer-unavailable"
            ? "部屋が見つかりません。コードを確認してください。"
            : "接続に失敗しました。もう一度お試しください。";
      }
      function closePeer() {
        connections.forEach((c) => c.close());
        connections = [];
        if (peer) peer.destroy();
        peer = null;
        lobbyMembers = [];
        localPhase = "lobby";
      }
      function startLocalMatch() {
        let settings = getSettings();
        if (lobbyMembers.length < settings.limit && !settings.fillCpu) {
          netStatus.textContent = `あと${settings.limit - lobbyMembers.length}人の参加が必要です`;
          return;
        }
        matchPlayers = settings.limit;
        localPhase = "ability";
        lobbyMembers.forEach((m) => (m.kind = null));
        connections.forEach(
          (c) => c.open && c.send({ type: "selectAbility" }),
        );

        openAbilitySelect("P1の能力を選ぶ");
      }
      // 人間プレイヤー全員の能力が決まった時だけ、ホストが試合を開始する。
      function tryStartAfterAbilities() {
        if (!isHost || localPhase !== "ability") return;
        if (!lobbyMembers.length || lobbyMembers.some((m) => !m.kind)) return;
        localPhase = "game";
        connections.forEach(
          (c) => c.open && c.send({ type: "start", count: matchPlayers }),
        );
        start();
      }
      // ゲスト端末のキー入力を50msごとにホストへ送信する。
      function startGuestControls() {
        cancelAnimationFrame(raf);
        const send = () => {
          if (!connections[0]?.open) return;
          connections[0].send({
            type: "input",
            input: { keys: { ...keys }, tackle: tackleQueued, use: false },
          });
          tackleQueued = false;
        };
        setInterval(send, 50);
      }
      // =========================================================
      // 4. マップ判定・CPUの経路探索
      // =========================================================
      const rnd = (a, b) => a + Math.random() * (b - a),
        D = (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
        C = (n, a, b) => Math.max(a, Math.min(b, n));
      function blocked(x, y, r = 25) {
        return WALLS.some(
          (w) =>
            x + r > w.x &&
            x - r < w.x + w.w &&
            y + r > w.y &&
            y - r < w.y + w.h,
        );
      }
      function randomOpen(m = 90) {
        for (let i = 0; i < 100; i++) {
          let p = { x: rnd(m, WORLD_W - m), y: rnd(m, WORLD_H - m) };
          if (!blocked(p.x, p.y, 35)) return p;
        }
        return { x: WORLD_W / 2, y: WORLD_H / 2 };
      }
      // 3×3に分かれた9部屋の範囲。CPUは各部屋を順番に探索する。
      const ROOM_RECTS = [
        [0, 0, M(1150), M(690)],
        [M(1184), 0, M(1216), M(690)],
        [M(2434), 0, WORLD_W - M(2434), M(690)],
        [0, M(724), M(1150), M(726)],
        [M(1184), M(724), M(1216), M(726)],
        [M(2434), M(724), WORLD_W - M(2434), M(726)],
        [0, M(1484), M(1150), WORLD_H - M(1484)],
        [M(1184), M(1484), M(1216), WORLD_H - M(1484)],
        [M(2434), M(1484), WORLD_W - M(2434), WORLD_H - M(1484)],
      ];
      function roomPoints(i) {
        let [x, y, w, h] = ROOM_RECTS[i],
          px = Math.min(M(210), w * 0.24),
          py = Math.min(M(170), h * 0.24);
        return [
          { x: x + px, y: y + py },
          { x: x + w - px, y: y + py },
          { x: x + w - px, y: y + h - py },
          { x: x + px, y: y + h - py },
        ];
      }
      function cpuCanSeeEgg(o, e) {
        return (
          Math.abs(e.x - o.x) <= VIEW_W / 2 && Math.abs(e.y - o.y) <= VIEW_H / 2
        );
      }
      // 壁を避けて目的地へ進むため、幅優先探索で経路を作る。
      function findPath(a, b) {
        const step = 70,
          cols = Math.ceil(WORLD_W / step),
          rows = Math.ceil(WORLD_H / step),
          key = (x, y) => y * cols + x,
          s = {
            x: C(Math.floor(a.x / step), 0, cols - 1),
            y: C(Math.floor(a.y / step), 0, rows - 1),
          },
          g = {
            x: C(Math.floor(b.x / step), 0, cols - 1),
            y: C(Math.floor(b.y / step), 0, rows - 1),
          },
          q = [s],
          seen = new Set([key(s.x, s.y)]),
          prev = new Map();
        while (q.length) {
          let n = q.shift();
          if (n.x === g.x && n.y === g.y) {
            let path = [],
              k = key(n.x, n.y);
            while (prev.has(k)) {
              path.push({ x: n.x * step + step / 2, y: n.y * step + step / 2 });
              n = prev.get(k);
              k = key(n.x, n.y);
            }
            return path.reverse().concat([{ x: b.x, y: b.y }]);
          }
          for (let [dx, dy] of [
            [1, 0],
            [-1, 0],
            [0, 1],
            [0, -1],
          ]) {
            let x = n.x + dx,
              y = n.y + dy,
              k = key(x, y),
              px = x * step + step / 2,
              py = y * step + step / 2;
            if (
              x < 0 ||
              y < 0 ||
              x >= cols ||
              y >= rows ||
              seen.has(k) ||
              blocked(px, py, 30)
            )
              continue;
            seen.add(k);
            prev.set(k, n);
            q.push({ x, y });
          }
        }
        return [{ x: b.x, y: b.y }];
      }
      function setCpuTarget(o, target) {
        o.exploreX = target.x;
        o.exploreY = target.y;
        o.path = findPath(o, target);
        o.pathIndex = 0;
        o.exploreTime = 12;
      }
      function nextRoomTarget(o) {
        if (o.sweepIndex >= 4) {
          o.visitedRooms.add(o.roomOrder[o.roomIndex]);
          o.roomIndex = (o.roomIndex + 1) % o.roomOrder.length;
          o.sweepIndex = 0;
        }
        let room = o.roomOrder[o.roomIndex],
          target = roomPoints(room)[o.sweepIndex++];
        setCpuTarget(o, target);
      }
      function moveInWorld(o, dt) {
        let ox = o.x,
          oy = o.y,
          nx = C(ox + o.vx * dt, 25, WORLD_W - 25),
          ny = C(oy + o.vy * dt, 25, WORLD_H - 25);
        if (!blocked(nx, oy)) {
          o.x = nx;
        } else {
          o.vx *= -0.25;
        }
        if (!blocked(o.x, ny)) {
          o.y = ny;
        } else {
          o.vy *= -0.25;
        }
      }
      // =========================================================
      // 5. 1ラウンド分のキャラ・卵子・アイテムを生成
      // =========================================================
      function make() {
        // 全員を白色に統一し、入室順の顔パーツで見分ける。
        let colors = Array(6).fill("#fff"),
          humanCount = mode === "local" ? lobbyMembers.length : 1,
          ks = Array.from(
            { length: matchPlayers },
            (_, i) =>
              lobbyMembers[i]?.kind ||
              [kind, "chemo", "rheo", "hyper", "capac"][i] ||
              K[i % K.length][0],
          ),
          cx = WORLD_W / 2,
          cy = WORLD_H / 2;
        let swimmers = colors.slice(0, matchPlayers).map((c, i) => {
          let a = -Math.PI / 2 + (i * Math.PI * 2) / matchPlayers,
            r = i ? 72 : 0,
            order = Array.from(
              { length: 9 },
              (_, j) => (j + (i - 1) * 3 + 9) % 9,
            );
          return {
            id: i,
            human: i < humanCount,
            x: cx + Math.cos(a) * r,
            y: cy + Math.sin(a) * r,
            vx: 0,
            vy: 0,
            color: c,
            kind: ks[i],
            dash: 0,
            mature: 0,
            item: null,
            immune: 0,
            secured: false,
            exploreX: cx,
            exploreY: cy,
            exploreTime: 0,
            lockedEgg: null,
            roomOrder: order,
            roomIndex: 0,
            sweepIndex: 0,
            visitedRooms: new Set(),
            path: [],
            pathIndex: 0,
            facingX: Math.cos(a),
            facingY: Math.sin(a),
            tackleTime: 0,
            tackleHit: false,
            stun: 0,
            exposed: 0,
            stagger: 0,
            staggerHold: 0,
          };
        });
        swimmers.filter((o) => !o.human).forEach(nextRoomTarget);
        let spots = [
          [330, 280],
          [740, 1080],
          [430, 1880],
          [1540, 330],
          [2020, 300],
          [3150, 310],
          [2860, 1040],
          [3260, 1880],
          [2050, 1900],
          [1410, 1860],
          [850, 1780],
          [2700, 1810],
        ]
          .map((v) => [M(v[0]), M(v[1])])
          .filter(
            (v) =>
              Math.hypot(v[0] - cx, v[1] - cy) >= START_SAFE_RADIUS &&
              !blocked(v[0], v[1], 60),
          )
          .sort(() => Math.random() - 0.5);
        let eggs = spots
          .slice(0, 3)
          .map((v) => ({
            x: v[0],
            y: v[1],
            active: true,
            revealed: true,
            claimed: false,
            owner: null,
            progress: 0,
            contested: false,
            contestTime: 0,
            burst: 0,
          }));
        let pickupSpots = [
          [410, 420],
          [930, 240],
          [1550, 930],
          [2120, 1320],
          [2890, 420],
          [3170, 1760],
        ].map((v) => [M(v[0]), M(v[1])]);
        let pickups = Object.keys(ITEMS).map((k, i) => ({
          kind: k,
          x: pickupSpots[i][0],
          y: pickupSpots[i][1],
          active: true,
          t: 0,
        }));
        return { swimmers, eggs, pickups };
      }
      // =========================================================
      // 6. 試合開始・カウントダウン・スコア表示
      // =========================================================

      // マップを先に表示し、描画完了後にカウントダウンを開始する。
      function enterMatchScreen(onReady) {
        select.style.display =
          result.style.display =
          title.style.display =
          lobby.style.display =
            "none";
        game.style.display = "flex";
        toast.style.display = "none";
        cancelAnimationFrame(raf);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => onReady && onReady()),
        );
      }
      function start() {
        if (mode === "solo") matchPlayers = 5;
        scores = Array(matchPlayers).fill(0);
        round = 1;
        enterMatchScreen(newRound);
      }
      function showCountdown(value) {
        toast.textContent = value === "START" ? "START!" : value;
        toast.style.display = "block";
        toast.style.fontSize = value === "START" ? "32px" : "56px";
        if (value === "START")
          setTimeout(() => {
            toast.style.display = "none";
            toast.style.fontSize = "";
          }, 650);
      }
      function sendCountdown(value) {
        showCountdown(value);
        if (mode === "local" && isHost)
          connections.forEach(
            (c) => c.open && c.send({ type: "countdown", value }),
          );
      }
      // ラウンドを初期化し「3→2→1→START」後にゲームループを開始。
      function newRound() {
        let id = ++countdownId;
        S = make();
        elapsed = 0;
        last = 0;
        boost = sensor = dummyT = 0;
        dummy = null;
        itemIcon.textContent = "–";
        itemName.textContent = "アイテムなし";
        document.getElementById("round").textContent = round;
        document.getElementById("time").textContent = "60";
        renderScores();
        cancelAnimationFrame(raf);
        draw();
        if (mode === "local" && isHost) {
          let state = {
            type: "state",
            S,
            elapsed,
            round,
            scores,
            boost,
            sensor,
            dummy,
          };
          connections.forEach((c) => c.open && c.send(state));
        }
        sendCountdown("3");
        setTimeout(() => id === countdownId && sendCountdown("2"), 1000);
        setTimeout(() => id === countdownId && sendCountdown("1"), 2000);
        setTimeout(() => {
          if (id !== countdownId) return;
          sendCountdown("START");
          last = performance.now();
          raf = requestAnimationFrame(loop);
        }, 3000);
      }
      function playerLabel(i) {
        if (i === myId) return "YOU";
        if (S?.swimmers[i]?.human) return "P" + (i + 1);
        return "CPU " + (i + 1);
      }
      function renderScores() {
        document.getElementById("scores").innerHTML = scores
          .map(
            (s, i) =>
              `<span class="${i === myId ? "you" : ""}">${playerLabel(i)} <b>${s}</b></span>`,
          )
          .join("");
      }
      function toastMsg(s) {
        toast.textContent = s;
        toast.style.fontSize = "";
        toast.style.display = "block";
        setTimeout(() => (toast.style.display = "none"), 800);
      }
      // =========================================================
      // 7. プレイヤー入力・アイテム・タックル
      // =========================================================
      function queueTackle() {
        tackleQueued = true;
      }
      onkeydown = (e) => {
        keys[e.key.toLowerCase()] = 1;
        if (e.key === " " && !e.repeat) {
          e.preventDefault();
          queueTackle();
        }
        if (e.key.toLowerCase() === "e") useItem();
      };
      onkeyup = (e) => {
        keys[e.key.toLowerCase()] = 0;
      };
      dash.onpointerdown = (e) => {
        e.preventDefault();
        queueTackle();
      };
      function useItem() {
        if (mode === "local" && !isHost) {
          connections[0]?.send({ type: "use" });
          return;
        }
        applyItem(0);
      }
      // 所持アイテムの種類に応じた効果を適用する。
      function applyItem(id) {
        let p = S?.swimmers[id];
        if (!p?.item) return;
        let k = p.item;
        p.item = null;
        if (id === myId) {
          itemIcon.textContent = "–";
          itemName.textContent = "アイテムなし";
        }
        if (k === "sensor" && id === 0) sensor = 2.5;
        if (k === "boost" && id === 0) boost = 3;
        if (k === "energy") p.dash = 0;
        if (k === "coat") p.immune = 8;
        if (k === "dummy") {
          dummy = { x: p.x, y: p.y };
          dummyT = 12;
        }
        if (k === "zinc")
          S.swimmers
            .filter((o) => o.id !== id)
            .forEach((o) => {
              let d = D(p, o);
              if (d < 160) {
                o.vx += ((o.x - p.x) / (d || 1)) * 450;
                o.vy += ((o.y - p.y) / (d || 1)) * 450;
              }
            });
        toastMsg(ITEMS[k][1]);
      }
      // 向いている方向へタックルを開始する。再使用待ち・硬直中は不可。
      function startTackle(o) {
        if (o.dash > 0 || o.stun > 0 || o.tackleTime > 0) return;
        let l = Math.hypot(o.facingX, o.facingY) || 1;
        o.facingX /= l;
        o.facingY /= l;
        o.vx = o.facingX * TACKLE_SPEED;
        o.vy = o.facingY * TACKLE_SPEED;
        o.tackleTime = TACKLE_TIME;
        o.tackleHit = false;
        o.dash = TACKLE_COOLDOWN;
      }
      function tickFighter(o, dt) {
        o.dash = Math.max(0, o.dash - dt);
        o.immune = Math.max(0, o.immune - dt);
        o.stun = Math.max(0, o.stun - dt);
        o.exposed = Math.max(0, o.exposed - dt);
        o.staggerHold = Math.max(0, o.staggerHold - dt);
        if (!o.staggerHold) o.stagger = Math.max(0, o.stagger - dt * 18);
        if (o.tackleTime > 0) {
          o.tackleTime -= dt;
          if (o.tackleTime <= 0 && !o.tackleHit) {
            o.stun = MISS_STUN;
            o.exposed = MISS_STUN;
          }
        }
      }
      // 人間プレイヤー1体分の移動・向き・速度を更新する。
      function updateHuman(o, input, dt) {
        if (!o || o.secured) return;
        let k = input.keys || {},
          ix = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0),
          iy = (k.s || k.arrowdown ? 1 : 0) - (k.w || k.arrowup ? 1 : 0),
          moving = !!(ix || iy),
          l = Math.hypot(ix, iy) || 1;
        ix /= l;
        iy /= l;
        o.mature += dt;
        tickFighter(o, dt);
        if (moving && o.tackleTime <= 0 && o.stun <= 0) {
          o.facingX = ix;
          o.facingY = iy;
        }
        if (input.tackle) startTackle(o);
        if (o.tackleTime > 0) return;
        let sp =
          160 *
          (o.id === 0 && boost ? 1.45 : 1) *
          (o.kind === "capac" && o.mature > 20 ? 1.18 : 1);
        if (o.kind === "rheo" && ix < 0 && o.y > M(920) && o.y < M(1240))
          sp *= 1.2;
        if (o.stun > 0) {
          o.vx *= Math.max(0, 1 - dt * 7);
          o.vy *= Math.max(0, 1 - dt * 7);
          return;
        }
        o.vx += (ix * sp - o.vx) * Math.min(1, dt * 8);
        o.vy += (iy * sp - o.vy) * Math.min(1, dt * 8);
      }
      // =========================================================
      // 8. メインゲームループ
      //    入力、CPU、衝突、卵子取得、通信、描画を毎フレーム更新
      // =========================================================
      function loop(t) {
        let dt = Math.min(0.033, (t - last) / 1000 || 0.016);
        last = t;
        elapsed += dt;
        document.getElementById("time").textContent = Math.max(
          0,
          60 - Math.floor(elapsed),
        );
        boost = Math.max(0, boost - dt);
        sensor = Math.max(0, sensor - dt);
        dummyT = Math.max(0, dummyT - dt);
        if (!dummyT) dummy = null;
        let p = S.swimmers[0],
          localTackle = tackleQueued;
        tackleQueued = false;
        updateHuman(p, { keys, tackle: localTackle }, dt);
        S.swimmers
          .filter((o) => o.human && o.id > 0)
          .forEach((o) => {
            let input = remoteInputs[o.id] || { keys: {}, tackle: false };
            updateHuman(o, input, dt);
            input.tackle = false;
          });
        let shown = S.swimmers[myId] || p;
        if (shown) {
          dash.classList.toggle("cooling", shown.dash > 0 || shown.stun > 0);
          tackleStatus.textContent =
            shown.stun > 0
              ? "硬直 " + shown.stun.toFixed(1)
              : shown.dash > 0
                ? "再使用 " + shown.dash.toFixed(1)
                : "SPACE";
        }
        S.swimmers
          .filter((o) => !o.human)
          .forEach((o) => {
            if (o.secured) return;
            o.mature += dt;
            tickFighter(o, dt);
            o.exploreTime -= dt;
            let available = S.eggs
              .map((e, i) => (!e.claimed ? i : -1))
              .filter((i) => i >= 0);
            if (!available.length) return;
            if (o.lockedEgg !== null && !available.includes(o.lockedEgg)) {
              o.lockedEgg = null;
              nextRoomTarget(o);
            }
            if (o.lockedEgg === null) {
              let visible = available.filter((i) => cpuCanSeeEgg(o, S.eggs[i]));
              if (visible.length) {
                o.lockedEgg = visible.sort(
                  (a, b) => D(o, S.eggs[a]) - D(o, S.eggs[b]),
                )[0];
                o.path = findPath(o, S.eggs[o.lockedEgg]);
                o.pathIndex = 0;
              }
            }
            if (
              o.lockedEgg !== null &&
              S.eggs[o.lockedEgg].contestTime > 3.5 &&
              Math.random() < dt * 0.65
            ) {
              o.lockedEgg = null;
              nextRoomTarget(o);
            }
            let target;
            if (o.lockedEgg !== null) {
              target = S.eggs[o.lockedEgg];
            } else {
              if (
                !o.path.length ||
                o.pathIndex >= o.path.length ||
                o.exploreTime <= 0
              )
                nextRoomTarget(o);
              target = o.path[o.pathIndex] || { x: o.exploreX, y: o.exploreY };
              if (D(o, target) < 48) {
                o.pathIndex++;
                if (o.pathIndex >= o.path.length) {
                  nextRoomTarget(o);
                  target = o.path[o.pathIndex] || {
                    x: o.exploreX,
                    y: o.exploreY,
                  };
                }
              }
            }
            let dx = target.x - o.x,
              dy = target.y - o.y,
              d = Math.hypot(dx, dy) || 1,
              os = 122 * (o.kind === "capac" && o.mature > 20 ? 1.2 : 1);
            if (o.tackleTime <= 0 && o.stun <= 0) {
              o.facingX = dx / d;
              o.facingY = dy / d;
            }
            let rival = S.swimmers
              .filter((p) => p.id !== o.id && !p.secured && D(o, p) < 105)
              .sort((a, b) => D(o, a) - D(o, b))[0];
            if (rival && o.dash <= 0 && Math.random() < dt * 4) startTackle(o);
            if (o.tackleTime > 0 || o.stun > 0) return;
            o.vx += ((dx / d) * os - o.vx) * dt * 3;
            o.vy += ((dy / d) * os - o.vy) * dt * 3;
          });
        S.swimmers.forEach((o) => {
          if (o.secured) return;
          moveInWorld(o, dt);
          if (o.y > M(920) && o.y < M(1240) && o.kind !== "rheo" && !o.immune)
            o.x += 45 * dt;
          if (o.y > M(1580) && o.x > M(1500) && o.x < M(2200)) {
            o.vx *= 0.94;
            o.vy *= 0.94;
          }
        });
        for (let i = 0; i < S.swimmers.length; i++)
          for (let j = i + 1; j < S.swimmers.length; j++) {
            let a = S.swimmers[i],
              b = S.swimmers[j],
              d = D(a, b);
            if (d < 38 && !a.secured && !b.secured) {
              let activeA = a.tackleTime > 0,
                activeB = b.tackleTime > 0,
                nabx = (b.x - a.x) / (d || 1),
                naby = (b.y - a.y) / (d || 1);
              if (activeA && activeB) {
                let opposing =
                  a.facingX * b.facingX + a.facingY * b.facingY < -0.35;
                if (opposing) {
                  a.tackleHit = b.tackleHit = true;
                  a.vx = -a.facingX * 190;
                  a.vy = -a.facingY * 190;
                  b.vx = -b.facingX * 190;
                  b.vy = -b.facingY * 190;
                  a.stun = b.stun = 0.22;
                  continue;
                }
              }
              let attacker =
                activeA && !activeB ? a : activeB && !activeA ? b : null;
              if (!attacker) {
                a.vx -= nabx * 30;
                a.vy -= naby * 30;
                b.vx += nabx * 30;
                b.vy += naby * 30;
                continue;
              }
              let victim = attacker === a ? b : a,
                nx = (victim.x - attacker.x) / (d || 1),
                ny = (victim.y - attacker.y) / (d || 1);
              attacker.tackleHit = true;
              if (victim.immune) continue;
              let towardAttacker = -nx * victim.facingX + -ny * victim.facingY;
              if (
                towardAttacker > 0.45 &&
                victim.stun <= 0 &&
                victim.exposed <= 0
              ) {
                attacker.vx -= nx * 360;
                attacker.vy -= ny * 360;
                attacker.stun = Math.max(attacker.stun, 0.32);
                attacker.exposed = Math.max(attacker.exposed, 0.32);
                continue;
              }
              let angleBonus = towardAttacker < -0.45 ? 1.35 : 1.15,
                staggerMult = 1 + victim.stagger / 100,
                exposedMult = victim.exposed > 0 ? 1.35 : 1,
                eggIndex = S.eggs.findIndex(
                  (e) =>
                    !e.claimed &&
                    (D(attacker, e) < EGG_RADIUS + 25 ||
                      D(victim, e) < EGG_RADIUS + 25),
                ),
                q =
                  285 *
                  angleBonus *
                  staggerMult *
                  exposedMult *
                  (eggIndex >= 0 ? EGG_KNOCKBACK : 1);
              victim.vx += nx * q;
              victim.vy += ny * q;
              victim.stagger = Math.min(100, victim.stagger + 35);
              victim.staggerHold = 2;
              victim.stun = Math.max(victim.stun, 0.16);
            }
          }
        S.pickups.forEach((q) => {
          if (!q.active) {
            q.t -= dt;
            if (q.t <= 0) q.active = 1;
          } else
            S.swimmers.forEach((o) => {
              if (!o.secured && !o.item && D(o, q) < 28) {
                o.item = q.kind;
                q.active = 0;
                q.t = 9;
                if (!o.id) {
                  itemIcon.textContent = ITEMS[q.kind][0];
                  itemName.textContent = ITEMS[q.kind][1];
                }
              }
            });
        });
        S.eggs.forEach((e) => {
          if (!e.active || e.claimed) return;
          let inside = S.swimmers.filter(
            (o) => !o.secured && D(o, e) < EGG_RADIUS,
          );
          e.contested = inside.length > 1;
          e.contestTime = e.contested ? e.contestTime + dt : 0;
          if (inside.length === 1) {
            let o = inside[0];
            if (e.owner !== o.id) {
              e.owner = o.id;
              e.progress = 0;
            }
            e.progress += dt;
          } else if (inside.length > 1) {
            let leader = inside.slice().sort((a, b) => D(a, e) - D(b, e))[0];
            if (e.owner !== leader.id) {
              e.owner = leader.id;
              e.progress = Math.max(0, e.progress - 0.25);
            }
            e.progress += dt * 0.3;
          } else {
            e.progress = Math.max(0, e.progress - dt * 0.4);
            e.owner = null;
          }
          if (e.progress >= CAPTURE_TIME && e.owner !== null) {
            let o = S.swimmers[e.owner];
            e.claimed = 1;
            o.secured = 1;
            let n = S.eggs.filter((x) => x.claimed).length;
            scores[o.id] += n === 1 ? 3 : n === 2 ? 2 : 1;
            renderScores();
            toastMsg(o.human ? "プレイヤーが獲得" : "CPUが獲得");
          }
        });
        draw();
        if (mode === "local" && isHost && t - lastNetSend > 65) {
          lastNetSend = t;
          let state = {
            type: "state",
            S,
            elapsed,
            round,
            scores,
            boost,
            sensor,
            dummy,
          };
          connections.forEach((c) => c.open && c.send(state));
        }
        if (S.eggs.every((e) => e.claimed) || elapsed > 60) {
          if (round < 3) {
            round++;
            setTimeout(newRound, 600);
          } else setTimeout(end, 600);
          return;
        }
        raf = requestAnimationFrame(loop);
      }
      // =========================================================
      // 9. Canvas描画
      // =========================================================

      // 入室順（P1～P6）に対応した顔を、進行方向を向いた頭へ描く。
      function drawFace(ctx, id) {
        ctx.save();
        ctx.strokeStyle = ctx.fillStyle = "#173040";
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        const eye = (x, y, rx = 2.1, ry = 2.8) => {
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
        };
        if (id === 0) {
          eye(7, -5); eye(7, 5);
        } else if (id === 1) {
          eye(7, -5, 1.8, 2.4); eye(7, 5, 1.8, 2.4);
          ctx.beginPath();
          ctx.moveTo(3, -8); ctx.lineTo(9, -6);
          ctx.moveTo(3, 8); ctx.lineTo(9, 6); ctx.stroke();
        } else if (id === 2) {
          ctx.beginPath();
          ctx.moveTo(4, -5); ctx.lineTo(10, -5);
          ctx.moveTo(4, 5); ctx.lineTo(10, 5); ctx.stroke();
        } else if (id === 3) {
          eye(7, -5); eye(7, 5);
          ctx.fillStyle = "#69cbe5";
          ctx.beginPath(); ctx.ellipse(4, 9, 1.8, 3.2, 0, 0, 7); ctx.fill();
        } else if (id === 4) {
          eye(7, -5, 3.2, 3.8); eye(7, 5, 3.2, 3.8);
          ctx.fillStyle = "white";
          ctx.fillRect(6, -7, 1.5, 1.5); ctx.fillRect(6, 3, 1.5, 1.5);
        } else {
          ctx.beginPath();
          ctx.moveTo(3, -5); ctx.lineTo(11, -5);
          ctx.moveTo(3, 5); ctx.lineTo(11, 5); ctx.stroke();
          eye(8, -5, 1.4, 1.4); eye(8, 5, 1.4, 1.4);
        }
        ctx.restore();
      }

      // プレイヤーを中心にカメラを動かし、マップ全体を描画する。
      function draw() {
        let x = cv.getContext("2d"),
          p = S.swimmers[myId] || S.swimmers[0],
          camX = C(p.x - VIEW_W / 2, 0, WORLD_W - VIEW_W),
          camY = C(p.y - VIEW_H / 2, 0, WORLD_H - VIEW_H),
          g = x.createLinearGradient(0, 0, VIEW_W, VIEW_H);
        g.addColorStop(0, "#183e54");
        g.addColorStop(1, "#082131");
        x.fillStyle = g;
        x.fillRect(0, 0, VIEW_W, VIEW_H);
        x.save();
        x.translate(-camX, -camY);
        x.strokeStyle = "#6fd8ea30";
        x.lineWidth = 6;
        x.strokeRect(3, 3, WORLD_W - 6, WORLD_H - 6);
        x.fillStyle = "#50c7dd18";
        x.fillRect(0, M(920), WORLD_W, M(320));
        x.fillStyle = "#9ae8c01a";
        x.fillRect(M(1500), M(1580), M(700), M(300));
        x.fillStyle = "#d9f8ff88";
        x.font = "15px sans-serif";
        x.fillText("→ 水流 →", M(1680), M(1080));
        x.fillText("粘液エリア", M(1760), M(1740));
        x.strokeStyle = "#ffd16635";
        x.setLineDash([12, 12]);
        x.beginPath();
        x.arc(WORLD_W / 2, WORLD_H / 2, START_SAFE_RADIUS, 0, 7);
        x.stroke();
        x.setLineDash([]);
        x.fillStyle = "#ffd16655";
        x.textAlign = "center";
        x.fillText(
          "START SAFE ZONE",
          WORLD_W / 2,
          WORLD_H / 2 - START_SAFE_RADIUS + 24,
        );
        WALLS.forEach((w) => {
          x.fillStyle = "#0a2637";
          x.fillRect(w.x, w.y, w.w, w.h);
          x.strokeStyle = "#5dbace99";
          x.lineWidth = 3;
          x.strokeRect(w.x, w.y, w.w, w.h);
        });
        S.pickups.forEach((q) => {
          if (!q.active) return;
          x.fillStyle = "#ffd166";
          x.beginPath();
          x.arc(q.x, q.y, 16, 0, 7);
          x.fill();
          x.fillStyle = "#143247";
          x.textAlign = "center";
          x.font = "bold 18px sans-serif";
          x.fillText(ITEMS[q.kind][0], q.x, q.y + 6);
        });
        if (dummy) {
          x.strokeStyle = "#d8a7ff";
          x.setLineDash([5, 7]);
          x.beginPath();
          x.arc(dummy.x, dummy.y, 32, 0, 7);
          x.stroke();
          x.setLineDash([]);
        }
        S.eggs.forEach((e) => {
          if (e.claimed) return;
          x.fillStyle = "#fff3c9";
          x.beginPath();
          x.arc(e.x, e.y, EGG_DRAW_RADIUS, 0, 7);
          x.fill();
          x.strokeStyle = e.contested ? "#ff6b6b" : "#ffd166";
          x.lineWidth = 4;
          x.beginPath();
          x.arc(
            e.x,
            e.y,
            EGG_RADIUS,
            -Math.PI / 2,
            -Math.PI / 2 + (Math.PI * 2 * e.progress) / CAPTURE_TIME,
          );
          x.stroke();
          if (e.contested) {
            x.fillStyle = "#ff8f83";
            x.font = "bold 13px sans-serif";
            x.textAlign = "center";
            x.fillText("争奪中", e.x, e.y - EGG_RADIUS - 10);
          }
        });
        S.swimmers.forEach((o) => {
          if (o.secured) return;
          let remaining = S.eggs.filter((e) => !e.claimed),
            glow =
              o.kind === "chemo" &&
              remaining.length &&
              Math.min(...remaining.map((e) => D(o, e))) < 180;
          x.save();
          x.translate(o.x, o.y);
          x.rotate(Math.atan2(o.facingY, o.facingX));
          if (o.tackleTime > 0) {
            x.fillStyle = "#ff664466";
            x.beginPath();
            x.ellipse(-5, 0, 36, 24, 0, 0, 7);
            x.fill();
          }
          x.strokeStyle = o.color;
          x.lineWidth = 7;
          x.lineCap = "round";
          x.beginPath();
          x.moveTo(-12, 0);
          x.bezierCurveTo(
            -30,
            Math.sin(elapsed * 12 + o.id) * 12,
            -43,
            -10,
            -58,
            10,
          );
          x.stroke();
          x.fillStyle = o.color;
          x.shadowBlur = glow ? 25 : 0;
          x.shadowColor = "#fff36a";
          x.beginPath();
          x.ellipse(0, 0, 19, 14, 0, 0, 7);
          x.fill();
          x.shadowBlur = 0;
          drawFace(x, o.id);
          x.restore();
          x.fillStyle = "white";
          x.textAlign = "center";
          x.font = "12px sans-serif";
          x.fillText(playerLabel(o.id), o.x, o.y - 23);
          if (o.stagger > 0) {
            x.fillStyle = "#32161b";
            x.fillRect(o.x - 22, o.y + 22, 44, 4);
            x.fillStyle = o.stagger > 65 ? "#ff4d4d" : "#ffb45b";
            x.fillRect(o.x - 22, o.y + 22, (44 * o.stagger) / 100, 4);
          }
        });
        if (sensor && myId === 0) {
          let e = S.eggs
            .filter((e) => !e.claimed)
            .sort((a, b) => D(p, a) - D(p, b))[0];
          if (e) {
            let a = Math.atan2(e.y - p.y, e.x - p.x);
            x.save();
            x.translate(p.x, p.y);
            x.rotate(a);
            x.fillStyle = "#ffd166";
            x.beginPath();
            x.moveTo(55, 0);
            x.lineTo(35, -11);
            x.lineTo(35, 11);
            x.fill();
            x.restore();
          }
        }
        x.restore();
        drawMinimap(x, camX, camY);
      }
      // 右上のミニマップと、現在カメラが映している範囲を描画する。
      function drawMinimap(x, camX, camY) {
        const mw = 200,
          mh = 120,
          mx = VIEW_W - mw - 16,
          my = 16,
          sx = mw / WORLD_W,
          sy = mh / WORLD_H;
        x.save();
        x.fillStyle = "#041521e8";
        x.strokeStyle = "#a8e6f2";
        x.lineWidth = 2;
        x.fillRect(mx, my, mw, mh);
        x.strokeRect(mx, my, mw, mh);
        x.fillStyle = "#50c7dd24";
        x.fillRect(mx, my + M(920) * sy, mw, M(320) * sy);
        x.fillStyle = "#9ae8c024";
        x.fillRect(
          mx + M(1500) * sx,
          my + M(1580) * sy,
          M(700) * sx,
          M(300) * sy,
        );
        x.fillStyle = "#5dbace99";
        WALLS.forEach((w) =>
          x.fillRect(
            mx + w.x * sx,
            my + w.y * sy,
            Math.max(1, w.w * sx),
            Math.max(1, w.h * sy),
          ),
        );
        x.strokeStyle = "#ffffff80";
        x.lineWidth = 1;
        x.strokeRect(mx + camX * sx, my + camY * sy, VIEW_W * sx, VIEW_H * sy);
        S.swimmers.forEach((o) => {
          if (o.secured) return;
          x.fillStyle = o.color;
          x.beginPath();
          x.arc(mx + o.x * sx, my + o.y * sy, o.id ? 4 : 6, 0, Math.PI * 2);
          x.fill();
          if (!o.id) {
            x.strokeStyle = "#ffd166";
            x.lineWidth = 2;
            x.stroke();
          }
        });
        x.fillStyle = "#fff";
        x.font = "bold 11px sans-serif";
        x.textAlign = "left";
        x.fillText("MAP", mx + 7, my + 13);
        x.restore();
      }
      // =========================================================
      // 10. 試合終了・再戦
      // =========================================================
      function showResult(finalScores) {
        game.style.display = "none";
        result.style.display = "flex";
        scores = finalScores;
        let rank = scores.map((s, i) => [s, i]).sort((a, b) => b[0] - a[0]);
        resultTitle.textContent =
          rank[0][1] === myId ? "あなたの勝利！" : "試合終了";
        ranking.innerHTML = rank
          .map(
            (r, i) =>
              `<div class="row"><b>${i + 1}位</b><span>${playerLabel(r[1])}</span><strong>${r[0]} pt</strong></div>`,
          )
          .join("");
      }
      function end() {
        if (mode === "local" && isHost)
          connections.forEach((c) => c.open && c.send({ type: "end", scores }));
        showResult(scores);
      }
      function replay() {
        result.style.display = "none";
        if (mode === "solo") start();
        else {
          lobby.style.display = "flex";
          inviteArea.style.display = "block";
          if (isHost) {
            hostStart.style.display = "inline-block";
            netStatus.textContent = "設定を確認して対戦を開始してください";
          } else {
            hostStart.style.display = "none";
            netStatus.textContent = "ホストの開始を待っています";
          }
        }
      }
    </script>
