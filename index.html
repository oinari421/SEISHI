<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>白いオタマジャクシ対戦探索ゲーム</title>
    <style>
      /* =========================================================
         画面全体の見た目
         タイトル、キャラ選択、ロビー、ゲーム画面、結果画面をここで装飾
         ========================================================= */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #061b29;
        color: #eaffff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(
          circle at 80% 20%,
          #19546b,
          transparent 35%
        );
      }
      h1 {
        font-size: clamp(52px, 9vw, 110px);
        line-height: 0.85;
        margin: 10px;
        text-align: center;
      }
      h1 span {
        color: #ffd166;
      }
      .sub {
        color: #65d9e8;
        font-weight: 900;
        letter-spacing: 0.25em;
      }
      .lead {
        color: #b4d6df;
      }
      .primary,
      .secondary {
        border: 0;
        border-radius: 99px;
        font-weight: 900;
        padding: 17px 30px;
        min-width: 230px;
      }
      .primary {
        background: #ffd166;
        color: #102332;
      }
      .secondary {
        background: #143b50;
        color: #eaffff;
        border: 1px solid #65d9e8;
      }
      .menu {
        display: grid;
        gap: 12px;
        margin: 20px;
      }
      .types {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        max-width: 1050px;
      }
      .type {
        background: #0d3044;
        color: white;
        border: 1px solid #6bb2c755;
        border-radius: 22px;
        padding: 20px;
        text-align: left;
        min-height: 235px;
      }
      .type.on {
        border-color: #ffd166;
        transform: translateY(-5px);
      }
      .type b {
        display: block;
        font-size: 19px;
        margin: 10px 0;
      }
      .type i {
        font-size: 34px;
        color: #ffd166;
      }
      .type span {
        font-size: 12px;
        color: #b4d5df;
        line-height: 1.7;
      }
      .panel {
        width: min(620px, 94vw);
        background: #082536dd;
        border: 1px solid #65d9e855;
        border-radius: 24px;
        padding: 24px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .tabs button {
        border: 0;
        border-radius: 12px;
        padding: 13px;
        background: #123d51;
        color: #fff;
        font-weight: 900;
      }
      .tabs button.on {
        background: #ffd166;
        color: #102332;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 18px 0;
      }
      .field input,
      .field select {
        width: 100%;
        background: #061b29;
        color: #fff;
        border: 1px solid #65d9e866;
        border-radius: 12px;
        padding: 13px;
      }
      .codebox {
        display: flex;
        gap: 8px;
      }
      .codebox input {
        font: 900 18px monospace;
        letter-spacing: 0.1em;
      }
      .players {
        display: grid;
        gap: 7px;
        margin: 14px 0;
      }
      .playerrow {
        display: flex;
        justify-content: space-between;
        background: #0d3044;
        border-radius: 10px;
        padding: 10px 13px;
      }
      .status {
        min-height: 24px;
        color: #65d9e8;
      }
      .game {
        height: 100vh;
        display: none;
        flex-direction: column;
      }
      .hud {
        height: 68px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 9px 20px;
        background: #051721;
      }
      .hud .time {
        font: 900 32px monospace;
        color: #ffd166;
        margin-right: auto;
      }
      .scores {
        display: flex;
        gap: 6px;
      }
      .scores span {
        background: #123547;
        border-radius: 8px;
        padding: 7px;
        font-size: 11px;
      }
      .scores .you {
        background: #ffd166;
        color: #102332;
      }
      .wrap {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
        position: relative;
      }
      .wrap canvas {
        width: min(100%, calc((100vh - 165px) * 1.667));
        aspect-ratio: 5/3;
        border: 1px solid #5fcde755;
        border-radius: 16px;
      }
      .toast {
        position: absolute;
        top: 25px;
        background: #071d2deb;
        border: 1px solid #ffd166;
        color: #ffd166;
        border-radius: 99px;
        padding: 10px 22px;
        font-weight: 900;
      }
      .map-intro {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        background: #03121ddd;
        color: white;
        text-align: center;
        pointer-events: none;
      }
      .map-intro.show { display: grid; }
      .map-intro b { color: #ffd166; font-size: clamp(34px, 6vw, 64px); }
      .map-intro span { display: block; margin-top: 10px; font-size: 17px; }
      .controls {
        height: 97px;
        background: #051721;
        display: flex;
        align-items: center;
        justify-content: space-around;
      }
      .dash {
        border: 0;
        border-radius: 50px;
        font-weight: 900;
      }
      .dash {
        width: 104px;
        height: 67px;
        background: #b84343;
        color: white;
        border: 2px solid #ffb09f;
        transition: 0.15s;
      }
      .dash.cooling {
        background: #3a4650;
        border-color: #71818d;
        color: #aebac2;
      }
      .help {
        font-size: 12px;
        color: #8db7c3;
      }
      .result .row {
        width: min(480px, 90vw);
        display: grid;
        grid-template-columns: 50px 1fr auto;
        padding: 13px 20px;
        margin: 6px;
        background: #0d3044;
        border-radius: 13px;
      }
      .result strong {
        color: #ffd166;
      }
      @media (max-width: 750px) {
        .types {
          grid-template-columns: 1fr 1fr;
        }
        .type {
          min-height: 190px;
          padding: 14px;
        }
        .screen {
          justify-content: flex-start;
          overflow: auto;
        }
        .scores span {
          font-size: 9px;
          padding: 5px;
        }
        .help {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- タイトル画面：遊ぶモードを選択する -->
    <section id="title" class="screen">
      <div class="sub">SEARCH × BLUFF × BATTLE</div>
      <h1>白い<br /><span>オタマジャクシ</span></h1>
      <p class="lead">広いマップから卵子を探し、動きで騙し、先に入り込め。</p>
      <div class="menu">
        <button class="primary" onclick="beginMode('solo')">一人で練習</button
        ><button class="secondary" onclick="beginMode('local')">
          ローカル対戦
        </button>
      </div>
      <p class="help">
        PC：WASD / 矢印キーで移動・Spaceでタックル
      </p>
    </section>
    <!-- 能力選択画面：一人用は開始前、対戦は全員入室後に表示する -->
    <section id="select" class="screen" style="display: none">
      <div class="sub">SELECT YOUR TYPE</div>
      <h2 id="selectTitle">泳ぎ方を選ぶ</h2>
      <div class="types" id="types"></div>
      <br /><button class="primary" id="typeConfirm" onclick="afterType()">
        このタイプで決定 →
      </button>
      <p id="selectStatus" class="status"></p>
    </section>
    <!-- ローカル対戦ロビー：部屋作成、招待コード参加、人数設定 -->
    <section id="lobby" class="screen" style="display: none">
      <div class="sub">LOCAL MATCH</div>
      <h2>招待ロビー</h2>
      <div class="panel">
        <div class="tabs">
          <button id="hostTab" class="on" onclick="setLobbyTab('host')">
            部屋を作る</button
          ><button id="joinTab" onclick="setLobbyTab('join')">
            コードで参加
          </button>
        </div>
        <div id="hostPane">
          <div class="field">
            <label>対戦人数</label
            ><select id="playerLimit" onchange="broadcastLobby()">
              <option>2</option>
              <option>3</option>
              <option selected>4</option>
              <option>5</option>
              <option>6</option>
            </select>
          </div>
          <div class="field">
            <label
              ><input
                id="fillCpu"
                type="checkbox"
                checked
                onchange="broadcastLobby()"
              />
              空席をCPUで補充する</label
            >
          </div>
          <button class="primary" id="createRoomBtn" onclick="createRoom()">
            招待コードを発行
          </button>
        </div>
        <div id="joinPane" style="display: none">
          <div class="field">
            <label>招待コード</label
            ><input id="joinCode" maxlength="20" placeholder="例：ABCD-1234" />
          </div>
          <button class="primary" onclick="joinRoom()">部屋に参加</button>
        </div>
        <div id="inviteArea" style="display: none">
          <div class="field">
            <label>招待コード</label>
            <div class="codebox">
              <input id="inviteCode" readonly /><button
                class="secondary"
                onclick="copyInvite()"
              >
                コピー
              </button>
            </div>
          </div>
          <div id="players" class="players"></div>
          <button
            class="primary"
            id="hostStart"
            style="display: none"
            onclick="startLocalMatch()"
          >
            対戦を開始
          </button>
        </div>
        <p id="netStatus" class="status"></p>
      </div>
    </section>
    <!-- ゲーム本編：HUD、Canvas、タックル操作 -->
    <section id="game" class="game">
      <header class="hud">
        <b>ROUND <span id="round">1</span>/3</b>
        <div class="time" id="time">60</div>
        <div class="scores" id="scores"></div>
      </header>
      <div class="wrap">
        <canvas id="cv" width="1000" height="600"></canvas>
        <div id="toast" class="toast" style="display: none"></div>
        <div id="mapIntro" class="map-intro"><div><small>NEXT MAP</small><br><b id="mapIntroName"></b><span id="mapIntroSub"></span></div></div>
      </div>
      <footer class="controls">
        <div class="help">移動 WASD / 矢印　タックル SPACE</div>
        <button class="dash" id="dash">
          TACKLE<br /><small id="tackleStatus">SPACE</small>
        </button>
      </footer>
    </section>
    <!-- 3ラウンド終了後の最終結果画面 -->
    <section id="result" class="screen result" style="display: none">
      <div class="sub">FINAL RESULT</div>
      <h2 id="resultTitle">試合終了</h2>
      <div id="ranking"></div>
      <br /><button class="primary" onclick="replay()">もう一度遊ぶ ↻</button>
    </section>
    <!-- PeerJS：招待コードを使った端末間通信に使用 -->
    <script src="vendor/peerjs/peerjs.min.js"></script>
    <script src="script.js?v=guest-canvas-fix-v4"></script>
  </body>
</html>
